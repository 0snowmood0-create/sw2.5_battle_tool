<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sword World 2.5 戰鬥紀錄器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            swDark: '#0f172a',
            swCard: '#1e293b',
            swHover: '#334155',
            swAccent: '#3b82f6',
            swEnemy: '#ef4444',
            swPlayer: '#10b981',
            swAlly: '#8b5cf6',
          }
        }
      }
    }
  </script>
  <style>
    /* Global scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    
    .zone-drop-active {
      border-color: #60a5fa !important;
      background-color: rgba(30, 58, 138, 0.2) !important;
    }

    .card-dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- ==================== TOP HEADER BAR ==================== -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide text-slate-100 flex items-center gap-2">
            Sword World 2.5
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800">戰鬥紀錄器</span>
          </h1>
          <p class="text-xs text-slate-400">TRPG Combat Tracker & Zone Manager</p>
        </div>
      </div>

      <!-- Round Control Center -->
      <div class="flex items-center gap-3 bg-slate-950 px-4 py-1.5 rounded-xl border border-slate-800 shadow-inner">
        <div class="text-center pr-3 border-r border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-400 block tracking-wider">Round</span>
          <span id="round-display" class="text-2xl font-black text-amber-400 leading-none">1</span>
        </div>
        <button id="btn-next-round" onclick="nextRound()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg shadow-md hover:shadow-amber-500/20 active:scale-95 transition flex items-center gap-2">
          <i class="fa-solid fa-forward-step"></i> 下一輪 (Next Round)
        </button>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Role Switcher (主/客 權限切換) -->
        <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="role-btn-gm" onclick="setRole('gm')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-amber-500 text-slate-950 shadow">
            <i class="fa-solid fa-crown text-[10px]"></i> 👑 GM (主)
          </button>
          <button id="role-btn-player" onclick="setRole('player')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-eye text-[10px]"></i> 👁️ 玩家 (客)
          </button>
        </div>

        <!-- Combat Mode Switcher -->
        <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="mode-btn-standard" onclick="setCombatMode('standard')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-blue-600 text-white shadow">
            <i class="fa-solid fa-layer-group text-[10px]"></i> 區域模式
          </button>
          <button id="mode-btn-grid" onclick="setCombatMode('grid')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-chess-board text-[10px]"></i> 2D 棋盤
          </button>
        </div>

        <!-- Fog of War GM Controls -->
        <div id="gm-visibility-controls" class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="btn-toggle-stats" onclick="toggleMonsterStatsVisibility()" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-emerald-950/80 text-emerald-300 border border-emerald-700 hover:bg-emerald-900/80 shadow-sm">
            <i class="fa-solid fa-eye text-emerald-400"></i> <span>數值：顯示中</span>
          </button>
          <button id="btn-toggle-names" onclick="toggleMonsterNamesVisibility()" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-indigo-950/80 text-indigo-300 border border-indigo-700 hover:bg-indigo-900/80 shadow-sm">
            <i class="fa-solid fa-eye text-indigo-400"></i> <span>名稱：顯示中</span>
          </button>
        </div>

        <button id="btn-add-unit" onclick="openUnitModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3.5 py-2 rounded-lg text-sm shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-plus text-xs"></i> 新增單位
        </button>

        <button id="btn-share-room" onclick="openRoomModal()" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-900/60 font-medium px-3.5 py-2 rounded-lg text-sm shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-wifi text-xs"></i> <span id="share-btn-label">畫面/房間分享</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== MAIN BATTLEFIELD BOARD ==================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">

    <!-- 2D Tactical Grid Board Bar & Canvas (Shown only in Grid Mode) -->
    <div id="grid-mode-container" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
        <div class="flex items-center gap-3 text-xs font-bold text-slate-200">
          <span class="flex items-center gap-1.5 text-indigo-400">
            <i class="fa-solid fa-chess-board text-sm"></i> 2D 戰術地圖棋盤
          </span>
          <span class="text-slate-500">|</span>
          <label class="flex items-center gap-1 text-slate-400">
            比例: 
            <select id="grid-scale-select" onchange="updateGridScale(this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-200 text-xs">
              <option value="3" selected>1 格 = 3 米 (SW2.5 亂戰半徑)</option>
              <option value="1">1 格 = 1 米</option>
              <option value="5">1 格 = 5 米</option>
            </select>
          </label>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <button onclick="clearGridSelection()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            <i class="fa-solid fa-hand-pointer"></i> 清除選取 / 取消選取
          </button>
          <div id="grid-selection-info" class="px-3 py-1.5 rounded-lg bg-indigo-950 text-indigo-300 border border-indigo-800/60 font-mono text-xs font-bold">
            點擊棋子檢視移動射程與詳細數據
          </div>
        </div>
      </div>

      <!-- Grid Board View Interactive Container & Selected Unit Panel -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
        <div class="lg:col-span-2 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-2xl overflow-x-auto flex justify-center">
          <div id="tactical-board" class="grid grid-cols-12 gap-1 bg-slate-950 p-3 rounded-xl border border-slate-800/80 shadow-inner min-w-[640px] select-none">
            <!-- Dynamically generated 12x12 Grid Cells & Tokens -->
          </div>
        </div>

        <!-- Selected Unit Detail Card in Grid Mode -->
        <div class="space-y-2">
          <h4 class="text-xs font-bold text-slate-400 flex items-center justify-between px-1">
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-id-card text-indigo-400"></i> 選取單位詳細資訊</span>
            <span class="text-[10px] text-slate-500 font-normal">點擊盤上棋子切換檢視</span>
          </h4>
          <div id="grid-selected-unit-panel" class="min-h-[380px]">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- Zone Container Grid (Shown in Standard Mode) -->
    <div id="battlefield-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 items-start">
      <!-- Dynamic Zones Rendered Here -->
    </div>
  </main>

  <!-- ==================== MODAL: ADD / EDIT UNIT ==================== -->
  <div id="unit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden">
      
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <h3 id="modal-title" class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-blue-400"></i> 新增單位 / 魔物
        </h3>
        <button onclick="closeUnitModal()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="unit-form" onsubmit="handleUnitFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="unit-id">

        <!-- Name & Faction -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2 space-y-1">
            <label class="text-xs font-semibold text-slate-400">名稱</label>
            <input type="text" id="unit-name" required placeholder="如：艾爾琳、蠻族戰士 A" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-400">陣營/類型</label>
            <select id="unit-faction" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
              <option value="player">己方 (PC)</option>
              <option value="ally">眷族/盟友</option>
              <option value="enemy" selected>敵方 (魔物)</option>
            </select>
          </div>
        </div>

        <!-- Initial Zone & Meter Position -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2 space-y-1">
            <label class="text-xs font-semibold text-slate-400">初始位置區 (區域模式)</label>
            <select id="unit-zone" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
              <!-- Populated via JS -->
        <!-- Initial Zone Position -->
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400">初始位置區 (區域模式)</label>
          <select id="unit-zone" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            <!-- Populated via JS -->
          </select>
        </div>

        <!-- Combat Stats & Movement (SW2.5 Core) -->
        <div class="border-t border-slate-800 pt-3">
          <span class="text-xs font-bold text-slate-400 block mb-2">SW 2.5 基礎數值 & 移動力</span>
          <div class="grid grid-cols-5 gap-2">
            <div>
              <label class="text-[10px] text-slate-400 block">命中</label>
              <input type="number" id="unit-hit" value="12" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-sm text-center text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block">迴避</label>
              <input type="number" id="unit-evasion" value="11" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-sm text-center text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block">防護點</label>
              <input type="number" id="unit-armor" value="4" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-sm text-center text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block">魔力/魔攻</label>
              <input type="number" id="unit-magic" value="0" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-sm text-center text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-indigo-400 block">移動(m)</label>
              <input type="number" id="unit-move-speed" value="12" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-sm text-center text-slate-100" title="通常移動距離 (m)">
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="pt-4 flex justify-end gap-2 border-t border-slate-800">
          <button type="button" onclick="closeUnitModal()" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition">取消</button>
          <button type="submit" class="px-5 py-2 rounded-lg text-sm font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-md transition">儲存單位</button>
        </div>
      </form>

    </div>
  </div>

  <!-- ==================== MODAL: ADD EFFECT ==================== -->
  <div id="effect-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-sm w-full p-5 shadow-2xl">
      <h3 class="text-md font-bold text-slate-100 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> 為單位新增 Buff / 持續效果
      </h3>
      <input type="hidden" id="effect-target-id">
      <div class="space-y-3">
        <!-- Preset Selector -->
        <div>
          <label class="text-xs font-semibold text-slate-400">SW 2.5 常用效果 / 魔法預設</label>
          <select id="effect-preset-select" onchange="applyEffectPreset()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
            <option value="">-- 自訂效果 / 手動輸入 --</option>
            <option value="field_protection">《防禦術》 (防護點 +1, 3 R)</option>
            <option value="holy_armor">《神聖護甲》 (防護點 +2, 3 R)</option>
            <option value="cats_eye">《貓之眼》 (命中點 +1, 3 R)</option>
            <option value="rabbits_foot">《兔之足》 (迴避點 +1, 3 R)</option>
            <option value="target_sight">《瞄準標記》 (命中點 +1, 3 R)</option>
            <option value="barkskin">《樹皮術》 (防護點 +1, 3 R)</option>
            <option value="magic_power">《魔力加護》 (魔力 +1, 3 R)</option>
            <option value="sunder_armor">《破甲》 (防護點 -2, 3 R)</option>
            <option value="dazzle">《眩目》 (命中點 -1, 3 R)</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-400">效果名稱 / 備註</label>
          <input type="text" id="effect-name" placeholder="如：《防禦術》、毒傷害" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
        
        <div>
          <label class="text-xs font-semibold text-slate-400">持續輪數 (R)</label>
          <input type="number" id="effect-rounds" min="1" max="99" value="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>

        <!-- Dynamic Stat Modifiers Section -->
        <div class="border-t border-slate-800 pt-2">
          <label class="text-xs font-bold text-amber-400 block mb-1">數值加減加成 (Stat Modifiers)</label>
          <div class="grid grid-cols-4 gap-2">
            <div>
              <label class="text-[10px] text-slate-400 block">命中加成</label>
              <input type="number" id="effect-mod-hit" value="0" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-center text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block">迴避加成</label>
              <input type="number" id="effect-mod-evasion" value="0" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-center text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block">防護加成</label>
              <input type="number" id="effect-mod-armor" value="0" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-center text-slate-100">
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block">魔力加成</label>
              <input type="number" id="effect-mod-magic" value="0" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-center text-slate-100">
            </div>
          </div>
        </div>
      </div>

      <div class="mt-5 flex justify-end gap-2">
        <button onclick="closeEffectModal()" class="px-3 py-1.5 rounded-lg text-xs text-slate-400 hover:text-white">取消</button>
        <button onclick="saveEffect()" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950">確認新增</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

  <!-- ==================== MODAL: ROOM SHARING & SPECTATE ==================== -->
  <div id="room-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5">
      
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-wifi text-indigo-400"></i> 即時戰鬥房間與畫面分享
        </h3>
        <button onclick="closeRoomModal()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Current Room Info if active -->
      <div id="active-room-box" class="hidden bg-slate-950 border border-indigo-900/60 rounded-xl p-4 text-center space-y-2">
        <span class="text-xs text-indigo-300 font-semibold block">目前連線中的房間代碼</span>
        <div class="flex items-center justify-center gap-2">
          <span id="current-room-code-display" class="text-3xl font-black font-mono tracking-widest text-indigo-400">---</span>
          <button onclick="copyRoomCode()" class="bg-indigo-950 hover:bg-indigo-900 text-indigo-300 border border-indigo-700 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
            <i class="fa-solid fa-copy"></i> 複製
          </button>
        </div>
        <p id="room-role-tag" class="text-xs text-slate-400">身份：房主 (主持人)</p>
        <button onclick="leaveRoom()" class="w-full mt-2 bg-red-950/60 hover:bg-red-900 text-red-300 text-xs py-1.5 rounded-lg border border-red-900/40 transition">
          中斷連線 / 離開房間
        </button>
      </div>

      <!-- Create or Join Room Buttons -->
      <div id="room-actions-box" class="space-y-4">
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
          <h4 class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-tower-broadcast text-indigo-400"></i> 我是 GM：建立即時分享房間
          </h4>
          <p class="text-xs text-slate-400">生成房間代碼，將當前戰鬥盤面即時同步給所有加入的玩家。</p>
          <button onclick="createShareRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-xs shadow transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-plus-circle"></i> 建立全新戰鬥房間
          </button>
        </div>

        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
          <h4 class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-eye text-emerald-400"></i> 我是玩家：輸入代碼加入觀戰
          </h4>
          <div class="flex gap-2">
            <input type="text" id="join-room-input" placeholder="輸入 6 位房間號 (如 SW-8492)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 uppercase font-mono tracking-wider focus:outline-none focus:border-emerald-500">
            <button onclick="joinShareRoom()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-xs shadow transition">
              連線觀戰
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- FIREBASE CLOUD REALTIME SYNC SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'sw25-tracker';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    let db = null;
    let auth = null;
    let currentUser = null;
    let activeUnsubscribe = null;

    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        if (initialAuthToken) {
          signInWithCustomToken(auth, initialAuthToken)
            .then(res => { currentUser = res.user; })
            .catch(() => signInAnonymously(auth).then(res => { currentUser = res.user; }));
        } else {
          signInAnonymously(auth).then(res => { currentUser = res.user; });
        }
      } catch (err) {
        console.warn("Firebase initialization skipped:", err);
      }
    }

    window.cloudSync = {
      isConfigured: () => !!db,
      pushState: async (roomCode, stateData) => {
        if (!db || !currentUser || !roomCode) return;
        try {
          const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode.toUpperCase());
          await setDoc(roomRef, {
            state: stateData,
            updatedAt: Date.now()
          }, { merge: true });
        } catch (e) {
          console.error("Cloud sync push error:", e);
        }
      },
      listenRoom: (roomCode, onUpdateCallback, onErrorCallback) => {
        if (!db || !roomCode) return null;
        if (activeUnsubscribe) activeUnsubscribe();

        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode.toUpperCase());
        activeUnsubscribe = onSnapshot(roomRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data && data.state) {
              onUpdateCallback(data.state);
            }
          } else if (onErrorCallback) {
            onErrorCallback("房間不存在或已失效");
          }
        }, (error) => {
          console.error("Room snapshot error:", error);
          if (onErrorCallback) onErrorCallback("房間連線中斷");
        });

        return activeUnsubscribe;
      },
      stopListen: () => {
        if (activeUnsubscribe) {
          activeUnsubscribe();
          activeUnsubscribe = null;
        }
      }
    };
  </script>

  <script>
    // --- HELPER & TOAST FUNCTIONS ---
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bg = type === 'warning' ? 'bg-amber-900/90 border-amber-600 text-amber-200' : 'bg-slate-900/90 border-blue-600 text-slate-100';
      toast.className = `px-4 py-2.5 rounded-xl border shadow-xl text-xs font-semibold backdrop-blur-md pointer-events-auto transition duration-300 flex items-center gap-2 ${bg}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'warning' ? 'fa-triangle-exclamation text-amber-400' : 'fa-circle-info text-blue-400'}"></i> <span>${escapeHtml(msg)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // --- STATE PERSISTENCE ---
    function saveState() {
      try {
        localStorage.setItem('sw25_tracker_state', JSON.stringify(state));
        if (activeRoomCode && window.cloudSync && window.cloudSync.isConfigured()) {
          window.cloudSync.pushState(activeRoomCode, state);
        }
      } catch (e) {
        console.error('Save state failed:', e);
      }
    }

    function loadSavedState() {
      try {
        const saved = localStorage.getItem('sw25_tracker_state');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === 'object') {
            state = Object.assign(state, parsed);
          }
        }
        if (!state.entities || state.entities.length === 0) {
          initDefaultData();
        }
      } catch (e) {
        console.error('Load state failed:', e);
        initDefaultData();
      }
    }

    // --- ROLE MANAGEMENT (GM / PLAYER) ---
    function setRole(role) {
      currentRole = role;
      const gmBtn = document.getElementById('role-btn-gm');
      const playerBtn = document.getElementById('role-btn-player');
      const gmControls = document.getElementById('gm-visibility-controls');

      if (role === 'gm') {
        if (gmBtn) gmBtn.className = 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-amber-500 text-slate-950 shadow';
        if (playerBtn) playerBtn.className = 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
        if (gmControls) gmControls.classList.remove('hidden');
        showToast('切換為：GM (主) 權限模式');
      } else {
        if (gmBtn) gmBtn.className = 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
        if (playerBtn) playerBtn.className = 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-emerald-600 text-white shadow';
        if (gmControls) gmControls.classList.add('hidden');
        showToast('切換為：玩家 (客) 權限模式');
      }
      renderApp();
    }

    // --- GM FOG OF WAR TOGGLES ---
    function updateFogOfWarButtonsUI() {
      const btnStats = document.getElementById('btn-toggle-stats');
      const btnNames = document.getElementById('btn-toggle-names');

      if (btnStats) {
        const isHidden = !!state.settings.hideMonsterStats;
        btnStats.className = isHidden
          ? 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-red-950/80 text-red-300 border border-red-800 hover:bg-red-900/80 shadow-sm'
          : 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-emerald-950/80 text-emerald-300 border border-emerald-700 hover:bg-emerald-900/80 shadow-sm';
        btnStats.innerHTML = isHidden
          ? `<i class="fa-solid fa-eye-slash text-red-400"></i> <span>數值：隱藏中</span>`
          : `<i class="fa-solid fa-eye text-emerald-400"></i> <span>數值：顯示中</span>`;
      }

      if (btnNames) {
        const isHidden = !!state.settings.hideMonsterNames;
        btnNames.className = isHidden
          ? 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-red-950/80 text-red-300 border border-red-800 hover:bg-red-900/80 shadow-sm'
          : 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-indigo-950/80 text-indigo-300 border border-indigo-700 hover:bg-indigo-900/80 shadow-sm';
        btnNames.innerHTML = isHidden
          ? `<i class="fa-solid fa-eye-slash text-red-400"></i> <span>名稱：隱藏中</span>`
          : `<i class="fa-solid fa-eye text-indigo-400"></i> <span>名稱：顯示中</span>`;
      }
    }

    function toggleMonsterStatsVisibility() {
      state.settings.hideMonsterStats = !state.settings.hideMonsterStats;
      saveState();
      renderApp();
      showToast(state.settings.hideMonsterStats ? '已對玩家隱藏魔物數字' : '已對玩家顯示魔物數字');
    }

    function toggleMonsterNamesVisibility() {
      state.settings.hideMonsterNames = !state.settings.hideMonsterNames;
      saveState();
      renderApp();
      showToast(state.settings.hideMonsterNames ? '已對玩家隱藏魔物名稱' : '已對玩家顯示魔物名稱');
    }

    // --- ROUND CONTROLLER ---
    function nextRound() {
      state.round += 1;
      state.entities.forEach(entity => {
        entity.actions.main = false;
        entity.actions.sub = false;
        entity.actions.skillDeclared = false;
        entity.moveType = 'none';
        
        if (entity.effects && entity.effects.length > 0) {
          entity.effects.forEach(eff => { eff.rounds -= 1; });
          entity.effects = entity.effects.filter(eff => eff.rounds > 0);
        }
      });
      saveState();
      renderApp();
      showToast(`進入 Round ${state.round}！已重置行動權利，過期 Buff 已移除。`);
    }

    // --- ZONE MANAGEMENT ---
    function addMeleeZone() {
      const count = state.zones.filter(z => z.id.startsWith('melee')).length + 1;
      const newZone = {
        id: `melee-${Date.now()}`,
        name: `亂戰區域 #${count}`,
        canDelete: true
      };
      state.zones.splice(state.zones.length - 1, 0, newZone);
      saveState();
      renderApp();
      showToast(`已新增 ${newZone.name}`);
    }

    function deleteZone(zoneId) {
      const zone = state.zones.find(z => z.id === zoneId);
      if (!zone) return;
      if (confirm(`確定要刪除「${zone.name}」嗎？該區域內的單位將移至預設區域。`)) {
        const fallbackZoneId = state.zones[0].id;
        state.entities.forEach(e => {
          if (e.zoneId === zoneId) e.zoneId = fallbackZoneId;
        });
        state.zones = state.zones.filter(z => z.id !== zoneId);
        saveState();
        renderApp();
        showToast(`已刪除 ${zone.name}`);
      }
    }

    function moveEntityToZone(entityId, zoneId) {
      const entity = state.entities.find(e => e.id === entityId);
      if (entity) {
        entity.zoneId = zoneId;
        saveState();
        renderApp();
      }
    }

    // --- ACTIONS & RESOURCE HELPERS ---
    function adjustResource(entityId, type, delta) {
      const entity = state.entities.find(e => e.id === entityId);
      if (!entity) return;
      if (type === 'hp') {
        entity.hp = Math.max(0, Math.min(entity.maxHp, entity.hp + delta));
      } else if (type === 'mp') {
        entity.mp = Math.max(0, Math.min(entity.maxMp, entity.mp + delta));
      }
      saveState();
      renderApp();
    }

    function toggleAction(entityId, actionType) {
      const entity = state.entities.find(e => e.id === entityId);
      if (!entity) return;
      entity.actions[actionType] = !entity.actions[actionType];
      saveState();
      renderApp();
    }

    function toggleStatus(entityId, statusId) {
      const entity = state.entities.find(e => e.id === entityId);
      if (!entity) return;
      if (!entity.statuses) entity.statuses = [];
      const idx = entity.statuses.indexOf(statusId);
      if (idx >= 0) {
        entity.statuses.splice(idx, 1);
      } else {
        entity.statuses.push(statusId);
      }
      saveState();
      renderApp();
    }

    // --- EFFECT / BUFF MANAGEMENT ---
    function openEffectModal(unitId) {
      document.getElementById('effect-target-id').value = unitId;
      document.getElementById('effect-preset-select').value = '';
      document.getElementById('effect-name').value = '';
      document.getElementById('effect-rounds').value = '3';
      document.getElementById('effect-mod-hit').value = '0';
      document.getElementById('effect-mod-evasion').value = '0';
      document.getElementById('effect-mod-armor').value = '0';
      document.getElementById('effect-mod-magic').value = '0';
      document.getElementById('effect-modal').classList.remove('hidden');
    }

    function closeEffectModal() {
      document.getElementById('effect-modal').classList.add('hidden');
    }

    function applyEffectPreset() {
      const presetKey = document.getElementById('effect-preset-select').value;
      if (presetKey && EFFECT_PRESETS[presetKey]) {
        const preset = EFFECT_PRESETS[presetKey];
        document.getElementById('effect-name').value = preset.name;
        document.getElementById('effect-rounds').value = preset.rounds;
        document.getElementById('effect-mod-hit').value = preset.mods.hit || 0;
        document.getElementById('effect-mod-evasion').value = preset.mods.evasion || 0;
        document.getElementById('effect-mod-armor').value = preset.mods.armor || 0;
        document.getElementById('effect-mod-magic').value = preset.mods.magic || 0;
      }
    }

    function saveEffect() {
      const unitId = document.getElementById('effect-target-id').value;
      const name = document.getElementById('effect-name').value.trim();
      const rounds = parseInt(document.getElementById('effect-rounds').value, 10) || 1;
      const hitMod = parseInt(document.getElementById('effect-mod-hit').value, 10) || 0;
      const evasionMod = parseInt(document.getElementById('effect-mod-evasion').value, 10) || 0;
      const armorMod = parseInt(document.getElementById('effect-mod-armor').value, 10) || 0;
      const magicMod = parseInt(document.getElementById('effect-mod-magic').value, 10) || 0;

      if (!name) return;

      const unit = state.entities.find(e => e.id === unitId);
      if (unit) {
        if (!unit.effects) unit.effects = [];
        unit.effects.push({
          id: `eff-${Date.now()}`,
          name,
          rounds,
          mods: { hit: hitMod, evasion: evasionMod, armor: armorMod, magic: magicMod }
        });
        saveState();
        renderApp();
        showToast(`已新增 Buff：「${name}」`);
      }
      closeEffectModal();
    }

    function adjustEffectRound(unitId, effectId, delta) {
      const unit = state.entities.find(e => e.id === unitId);
      if (!unit || !unit.effects) return;
      const eff = unit.effects.find(e => e.id === effectId);
      if (eff) {
        eff.rounds += delta;
        if (eff.rounds <= 0) {
          unit.effects = unit.effects.filter(e => e.id !== effectId);
        }
        saveState();
        renderApp();
      }
    }

    function removeEffect(unitId, effectId) {
      const unit = state.entities.find(e => e.id === unitId);
      if (!unit || !unit.effects) return;
      unit.effects = unit.effects.filter(e => e.id !== effectId);
      saveState();
      renderApp();
    }

    // --- DYNAMIC STATS & BADGE HELPERS ---
    function getFactionBorderColor(faction) {
      switch (faction) {
        case 'player': return 'border-emerald-700/60 bg-emerald-950/10';
        case 'ally': return 'border-purple-700/60 bg-purple-950/10';
        case 'enemy': return 'border-red-700/60 bg-red-950/10';
        default: return 'border-slate-800';
      }
    }

    function getFactionBadge(faction) {
      switch (faction) {
        case 'player': return '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800">PC</span>';
        case 'ally': return '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-800">盟友</span>';
        case 'enemy': return '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-950 text-red-300 border border-red-800">敵方</span>';
        default: return '';
      }
    }

    function getEffectiveStats(entity) {
      const base = entity.stats || { hit: 0, evasion: 0, armor: 0, magic: 0 };
      const mods = { hit: 0, evasion: 0, armor: 0, magic: 0 };

      if (entity.effects && entity.effects.length > 0) {
        entity.effects.forEach(eff => {
          if (eff.mods) {
            mods.hit += eff.mods.hit || 0;
            mods.evasion += eff.mods.evasion || 0;
            mods.armor += eff.mods.armor || 0;
            mods.magic += eff.mods.magic || 0;
          }
        });
      }

      return {
        base,
        mods,
        effective: {
          hit: base.hit + mods.hit,
          evasion: base.evasion + mods.evasion,
          armor: base.armor + mods.armor,
          magic: base.magic + mods.magic
        }
      };
    }

    function renderStatBadge(label, baseVal, modVal, effVal, customColorClass, hideStats) {
      if (hideStats) {
        return `
          <div>
            <span class="text-[10px] text-slate-500 block">${label}</span>
            <span class="font-bold text-slate-400">??</span>
          </div>
        `;
      }

      let modText = '';
      let colorClass = customColorClass || 'text-slate-100';

      if (modVal > 0) {
        modText = `<span class="text-[9px] text-emerald-400 font-normal"> (+${modVal})</span>`;
        colorClass = 'text-emerald-300 font-bold';
      } else if (modVal < 0) {
        modText = `<span class="text-[9px] text-red-400 font-normal"> (${modVal})</span>`;
        colorClass = 'text-red-300 font-bold';
      }

      return `
        <div>
          <span class="text-[10px] text-slate-400 block">${label}</span>
          <span class="font-bold ${colorClass}">${effVal}</span>${modText}
        </div>
      `;
    }

    function renderStatusBadges(entity) {
      const currentStatuses = entity.statuses || [];
      return STATUS_PRESETS.map(preset => {
        const active = currentStatuses.includes(preset.id);
        const activeStyle = active ? preset.color : 'text-slate-600 bg-slate-900 border-slate-800 opacity-50 hover:opacity-100';
        return `
          <button onclick="toggleStatus('${entity.id}', '${preset.id}')" class="text-[10px] px-1.5 py-0.5 rounded border transition flex items-center gap-1 ${activeStyle}">
            <i class="fa-solid ${preset.icon} text-[9px]"></i> ${preset.label}
          </button>
        `;
      }).join('');
    }

    function renderEffectsList(entity) {
      if (!entity.effects || entity.effects.length === 0) {
        return `<div class="text-[10px] text-slate-600 italic">無持續效果</div>`;
      }
      return entity.effects.map(eff => `
        <div class="flex items-center justify-between bg-slate-900 border border-slate-800 rounded px-2 py-1 text-[11px]">
          <div class="flex items-center gap-1.5">
            <span class="font-semibold text-amber-300">${escapeHtml(eff.name)}</span>
            <span class="text-[9px] px-1.5 py-0.2 rounded bg-amber-950 text-amber-400 border border-amber-800/60 font-mono">剩 ${eff.rounds} R</span>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="adjustEffectRound('${entity.id}', '${eff.id}', -1)" class="text-[9px] bg-slate-800 hover:bg-slate-700 px-1 rounded border border-slate-700 text-slate-300 font-mono">-1R</button>
            <button onclick="adjustEffectRound('${entity.id}', '${eff.id}', 1)" class="text-[9px] bg-slate-800 hover:bg-slate-700 px-1 rounded border border-slate-700 text-slate-300 font-mono">+1R</button>
            <button onclick="removeEffect('${entity.id}', '${eff.id}')" class="text-slate-500 hover:text-red-400 text-[10px] ml-1">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function closeUnitModal() {
      document.getElementById('unit-modal').classList.add('hidden');
    }

    // --- ROOM & SHARING MODAL CONTROLS ---
    function openRoomModal() {
      document.getElementById('room-modal').classList.remove('hidden');
    }

    function closeRoomModal() {
      document.getElementById('room-modal').classList.add('hidden');
    }

    function createShareRoom() {
      const code = 'SW-' + Math.floor(1000 + Math.random() * 9000);
      activeRoomCode = code;
      document.getElementById('current-room-code-display').innerText = code;
      document.getElementById('room-role-tag').innerText = '身份：房主 (GM 主端)';
      document.getElementById('active-room-box').classList.remove('hidden');
      document.getElementById('room-actions-box').classList.add('hidden');
      updateShareBtnLabel();

      if (window.cloudSync && window.cloudSync.isConfigured()) {
        window.cloudSync.pushState(code, state);
      }

      setRole('gm');
      showToast(`連線房間已建立！房間代碼：${code}`);
    }

    function joinShareRoom() {
      const input = document.getElementById('join-room-input').value.trim().toUpperCase();
      if (!input) {
        showToast('請輸入房間號代碼', 'warning');
        return;
      }

      activeRoomCode = input;
      document.getElementById('current-room-code-display').innerText = input;
      document.getElementById('room-role-tag').innerText = '身份：觀戰/玩家 (客端)';
      document.getElementById('active-room-box').classList.remove('hidden');
      document.getElementById('room-actions-box').classList.add('hidden');
      updateShareBtnLabel();

      if (window.cloudSync && window.cloudSync.isConfigured()) {
        window.cloudSync.listenRoom(input, (remoteState) => {
          if (remoteState) {
            state = remoteState;
            renderApp();
            showToast('已從雲端同步最新戰況');
          }
        }, (errMsg) => {
          showToast(errMsg, 'warning');
        });
      }

      setRole('player');
      closeRoomModal();
    }

    function leaveRoom() {
      if (window.cloudSync) window.cloudSync.stopListen();
      activeRoomCode = null;
      document.getElementById('active-room-box').classList.add('hidden');
      document.getElementById('room-actions-box').classList.remove('hidden');
      updateShareBtnLabel();
      showToast('已離開連線房間');
    }

    function copyRoomCode() {
      if (!activeRoomCode) return;
      const dummy = document.createElement('textarea');
      document.body.appendChild(dummy);
      dummy.value = activeRoomCode;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      showToast(`已複製房間號：${activeRoomCode}`);
    }

    function updateShareBtnLabel() {
      const label = document.getElementById('share-btn-label');
      if (label) {
        label.innerText = activeRoomCode ? `連線中: ${activeRoomCode}` : '畫面/房間分享';
      }
    }

    // --- COMBAT MODE SWITCHER ---
    function setCombatMode(mode) {
      state.combatMode = mode;
      const stdBtn = document.getElementById('mode-btn-standard');
      const gridBtn = document.getElementById('mode-btn-grid');
      const gridContainer = document.getElementById('grid-mode-container');
      const fieldGrid = document.getElementById('battlefield-grid');

      stdBtn.className = 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
      gridBtn.className = 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';

      if (mode === 'grid') {
        gridBtn.className = 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-indigo-600 text-white shadow';
        gridContainer.classList.remove('hidden');
        fieldGrid.classList.add('hidden');
        showToast('已切換為：2D 戰術棋盤地圖');
      } else {
        stdBtn.className = 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-blue-600 text-white shadow';
        gridContainer.classList.add('hidden');
        fieldGrid.classList.remove('hidden');
        showToast('已切換為：SW 2.5 區域戰鬥模式');
      }

      saveState();
      renderApp();
    }

    // --- 2D GRID BOARD LOGIC ---
    function updateGridScale(val) {
      state.gridScale = parseInt(val, 10) || 3;
      saveState();
      renderApp();
    }

    function clearGridSelection() {
      state.selectedGridUnitId = null;
      renderApp();
    }

    function selectGridToken(unitId) {
      state.selectedGridUnitId = unitId;
      renderApp();
    }

    function moveGridToken(unitId, targetX, targetY) {
      const unit = state.entities.find(e => e.id === unitId);
      if (!unit) return;
      unit.gridX = targetX;
      unit.gridY = targetY;
      saveState();
      renderApp();
      showToast(`已移動 ${unit.name} 至格點 (${targetX}, ${targetY})`);
    }

    function renderGridBoard() {
      const board = document.getElementById('tactical-board');
      const infoBox = document.getElementById('grid-selection-info');
      const selectedPanel = document.getElementById('grid-selected-unit-panel');
      if (!board) return;

      board.innerHTML = '';
      const selectedUnit = state.entities.find(e => e.id === state.selectedGridUnitId);

      // Render Selected Unit Card Side Panel
      if (selectedPanel) {
        selectedPanel.innerHTML = '';
        if (selectedUnit) {
          selectedPanel.appendChild(createEntityCardDOM(selectedUnit));
        } else {
          selectedPanel.innerHTML = `
            <div class="h-full min-h-[360px] bg-slate-900 border border-dashed border-slate-800 rounded-2xl flex flex-col items-center justify-center p-6 text-center text-slate-500">
              <i class="fa-solid fa-hand-pointer text-3xl mb-2 text-slate-600 animate-bounce"></i>
              <p class="text-xs font-bold text-slate-400">尚未選擇棋子</p>
              <p class="text-[11px] text-slate-600 mt-1">請在左側戰術棋盤點擊任意棋子以檢視其詳細數據與進行操作</p>
            </div>
          `;
        }
      }

      if (selectedUnit && infoBox) {
        const speed = selectedUnit.moveSpeed || 12;
        const maxCells = Math.floor(speed / state.gridScale);
        infoBox.innerHTML = `<span class="text-white">${selectedUnit.name}</span> 移動力: ${speed}m (約 ${maxCells} 格)`;
      } else if (infoBox) {
        infoBox.innerText = '點擊棋子檢視移動射程與詳細數據';
      }

      // Check melee proximity pairs
      const enemyUnits = state.entities.filter(e => e.faction === 'enemy');
      const playerUnits = state.entities.filter(e => e.faction === 'player' || e.faction === 'ally');

      const isMeleeCell = (gx, gy) => {
        return playerUnits.some(pu => {
          const pDist = Math.abs((pu.gridX || 1) - gx) + Math.abs((pu.gridY || 1) - gy);
          if (pDist > 1) return false;
          return enemyUnits.some(eu => {
            const eDist = Math.abs((eu.gridX || 1) - gx) + Math.abs((eu.gridY || 1) - gy);
            return eDist <= 1;
          });
        });
      };

      for (let y = 1; y <= 12; y++) {
        for (let x = 1; x <= 12; x++) {
          const cell = document.createElement('div');
          const isMelee = isMeleeCell(x, y);
          let cellBg = 'bg-slate-900 border-slate-800/80 hover:bg-slate-800/60';

          if (isMelee) {
            cellBg = 'bg-amber-950/20 border-amber-500/50 shadow-inner';
          }

          // Highlight reachable range if a unit is selected
          if (selectedUnit) {
            const sx = selectedUnit.gridX || 1;
            const sy = selectedUnit.gridY || 1;
            const distCells = Math.max(Math.abs(sx - x), Math.abs(sy - y));
            const moveSpeed = selectedUnit.moveSpeed || 12;
            const resCells = 1;
            const normCells = Math.floor(moveSpeed / state.gridScale);
            const fullCells = normCells * 3;

            if (x === sx && y === sy) {
              cellBg = 'bg-indigo-900/60 border-indigo-400 shadow-md';
            } else if (distCells <= resCells) {
              cellBg = 'bg-sky-950/40 border-sky-600/60';
            } else if (distCells <= normCells) {
              cellBg = 'bg-emerald-950/30 border-emerald-600/40';
            } else if (distCells <= fullCells) {
              cellBg = 'bg-amber-950/30 border-amber-600/40';
            }
          }

          cell.className = `w-12 h-12 md:w-14 md:h-14 border rounded-xl flex flex-col items-center justify-center relative cursor-pointer transition ${cellBg}`;
          
          cell.onclick = () => {
            if (selectedUnit) {
              moveGridToken(selectedUnit.id, x, y);
            }
          };

          // Find unit occupying this cell
          const unit = state.entities.find(e => (e.gridX || 1) === x && (e.gridY || 1) === y);
          if (unit) {
            const isGM = (currentRole === 'gm');
            const isEnemy = (unit.faction === 'enemy');
            const hideName = (!isGM && isEnemy && state.settings.hideMonsterNames);

            let nameStr = unit.name;
            if (hideName) {
              const enemyList = state.entities.filter(e => e.faction === 'enemy');
              const idx = enemyList.findIndex(e => e.id === unit.id) + 1;
              nameStr = `#${idx > 0 ? idx : 1}`;
            }

            let tokenBg = 'bg-emerald-600 border-emerald-300';
            if (unit.faction === 'enemy') tokenBg = 'bg-red-600 border-red-300';
            if (unit.faction === 'ally') tokenBg = 'bg-purple-600 border-purple-300';

            const isSelectedToken = selectedUnit && selectedUnit.id === unit.id;
            const selectedRing = isSelectedToken ? 'ring-4 ring-amber-400 scale-105 z-20' : '';

            const token = document.createElement('div');
            token.className = `w-9 h-9 md:w-11 md:h-11 rounded-full border-2 ${tokenBg} flex flex-col items-center justify-center shadow-lg text-white font-bold text-[10px] md:text-xs select-none transition transform hover:scale-110 z-10 ${selectedRing}`;
            token.innerHTML = `
              <span class="truncate max-w-[36px] px-0.5">${escapeHtml(nameStr)}</span>
              <span class="text-[8px] opacity-80">${unit.hp}HP</span>
            `;

            token.onclick = (ev) => {
              ev.stopPropagation();
              selectGridToken(unit.id);
            };

            cell.appendChild(token);
          }

          board.appendChild(cell);
        }
      }
    }

    // --- BATTLEFIELD ZONES RENDERER ---
    function renderBattlefield() {
      const grid = document.getElementById('battlefield-grid');
      if (!grid) return;
      grid.innerHTML = '';
      renderStandardZoneView(grid);
    }

    function renderStandardZoneView(grid) {
      grid.className = "grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 items-start";
      
      state.zones.forEach(zone => {
        const zoneCol = document.createElement('div');
        zoneCol.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col min-h-[380px] transition-colors duration-200';
        
        zoneCol.ondragover = (e) => { e.preventDefault(); zoneCol.classList.add('zone-drop-active'); };
        zoneCol.ondragleave = () => { zoneCol.classList.remove('zone-drop-active'); };
        zoneCol.ondrop = (e) => {
          e.preventDefault();
          zoneCol.classList.remove('zone-drop-active');
          const unitId = e.dataTransfer.getData('text/plain');
          if (unitId) moveEntityToZone(unitId, zone.id);
        };

        const isGM = (currentRole === 'gm');
        const deleteBtnHTML = (isGM && zone.canDelete) ? `
          <button onclick="deleteZone('${zone.id}')" class="text-slate-500 hover:text-red-400 text-xs transition p-1">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        ` : '';

        zoneCol.innerHTML = `
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
            <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-layer-group text-blue-400 text-xs"></i> ${escapeHtml(zone.name)}
            </h3>
            <div class="flex items-center gap-1">
              ${deleteBtnHTML}
            </div>
          </div>
          <div class="entity-card-list space-y-3 flex-1"></div>
        `;

        const listContainer = zoneCol.querySelector('.entity-card-list');
        const unitsInZone = state.entities.filter(e => e.zoneId === zone.id);

        if (unitsInZone.length === 0) {
          listContainer.innerHTML = `<div class="h-32 border border-dashed border-slate-800 rounded-xl flex items-center justify-center text-xs text-slate-600 italic">置入單位或拖拽至此區域</div>`;
        } else {
          unitsInZone.forEach(unit => {
            listContainer.appendChild(createEntityCardDOM(unit));
          });
        }

        grid.appendChild(zoneCol);
      });

      if (currentRole === 'gm') {
        const addZoneCard = document.createElement('button');
        addZoneCard.onclick = addMeleeZone;
        addZoneCard.className = 'border-2 border-dashed border-slate-800 hover:border-blue-500/60 hover:bg-slate-900/50 rounded-2xl p-6 min-h-[380px] flex flex-col items-center justify-center gap-2 text-slate-500 hover:text-blue-400 transition group';
        addZoneCard.innerHTML = `
          <i class="fa-solid fa-circle-plus text-2xl group-hover:scale-110 transition-transform"></i>
          <span class="text-xs font-bold">新增亂戰區域 (Add Melee Zone)</span>
        `;
        grid.appendChild(addZoneCard);
      }
    }

    // --- ENTITY CARD DOM CREATOR ---
    function createEntityCardDOM(unit) {
      const card = document.createElement('div');
      const isGM = (currentRole === 'gm');
      const isEnemy = (unit.faction === 'enemy');
      const canEdit = isGM || !isEnemy;

      const hideStats = (!isGM && isEnemy && state.settings.hideMonsterStats);
      const hideName = (!isGM && isEnemy && state.settings.hideMonsterNames);

      let displayName = unit.name;
      if (hideName) {
        const enemyList = state.entities.filter(e => e.faction === 'enemy');
        const idx = enemyList.findIndex(e => e.id === unit.id) + 1;
        displayName = `未知魔物 #${idx > 0 ? idx : 1}`;
      }

      const statData = getEffectiveStats(unit);
      const eff = statData.effective;
      const mods = statData.mods;

      const hpPercent = Math.max(0, Math.min(100, Math.round((unit.hp / unit.maxHp) * 100)));
      const mpPercent = unit.maxMp > 0 ? Math.max(0, Math.min(100, Math.round((unit.mp / unit.maxMp) * 100))) : 0;

      const borderColor = getFactionBorderColor(unit.faction);
      const factionBadge = getFactionBadge(unit.faction);

      card.className = `bg-slate-900 border rounded-xl p-3.5 shadow-lg space-y-3 transition hover:border-slate-700 ${borderColor}`;
      card.setAttribute('draggable', 'true');
      card.ondragstart = (e) => { e.dataTransfer.setData('text/plain', unit.id); };

      const damageTaken = Math.max(0, unit.maxHp - unit.hp);
      const hpDisplayText = hideStats ? `?? / ?? <span class="text-[10px] text-red-400 font-normal">(已受 ${damageTaken} 傷害)</span>` : `${unit.hp} / ${unit.maxHp}`;
      const mpDisplayText = hideStats ? `?? / ??` : `${unit.mp} / ${unit.maxMp}`;

      const resourceBtns = canEdit ? `
        <div class="flex items-center gap-1 mt-1">
          <button onclick="adjustResource('${unit.id}', 'hp', -5)" class="text-[10px] bg-red-950 hover:bg-red-900 text-red-300 px-1.5 py-0.5 rounded border border-red-800 font-mono">-5</button>
          <button onclick="adjustResource('${unit.id}', 'hp', -1)" class="text-[10px] bg-red-950 hover:bg-red-900 text-red-300 px-1.5 py-0.5 rounded border border-red-800 font-mono">-1</button>
          <button onclick="adjustResource('${unit.id}', 'hp', 1)" class="text-[10px] bg-emerald-950 hover:bg-emerald-900 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-800 font-mono">+1</button>
          <button onclick="adjustResource('${unit.id}', 'hp', 5)" class="text-[10px] bg-emerald-950 hover:bg-emerald-900 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-800 font-mono">+5</button>
        </div>
      ` : '';

      const editActionsHTML = canEdit ? `
        <button onclick="openUnitModal('${unit.id}')" class="text-slate-500 hover:text-blue-400 text-xs transition p-1">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <button onclick="deleteEntity('${unit.id}')" class="text-slate-500 hover:text-red-400 text-xs transition p-1">
          <i class="fa-solid fa-trash"></i>
        </button>
      ` : '';

      const mainActionState = unit.actions.main ? 'checked' : '';
      const subActionState = unit.actions.sub ? 'checked' : '';
      const skillDeclaredState = unit.actions.skillDeclared ? 'checked' : '';
      const actionDisabled = canEdit ? '' : 'disabled';

      card.innerHTML = `
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm text-slate-100 truncate max-w-[150px]">${escapeHtml(displayName)}</span>
            ${factionBadge}
          </div>
          <div class="flex items-center gap-1">
            ${editActionsHTML}
          </div>
        </div>

        <div class="space-y-1.5 bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
          <div>
            <div class="flex justify-between text-xs font-bold mb-1">
              <span class="text-red-400 flex items-center gap-1"><i class="fa-solid fa-heart text-[10px]"></i> HP</span>
              <span class="font-mono text-slate-200">${hpDisplayText}</span>
            </div>
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-red-600 to-red-500 transition-all duration-300" style="width: ${hpPercent}%"></div>
            </div>
          </div>

          <div>
            <div class="flex justify-between text-xs font-bold mb-1">
              <span class="text-blue-400 flex items-center gap-1"><i class="fa-solid fa-bolt text-[10px]"></i> MP</span>
              <span class="font-mono text-slate-200">${mpDisplayText}</span>
            </div>
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-blue-600 to-blue-500 transition-all duration-300" style="width: ${mpPercent}%"></div>
            </div>
          </div>

          ${resourceBtns}
        </div>

        <div class="grid grid-cols-4 gap-1 text-center bg-slate-950/60 p-2 rounded-lg border border-slate-800/60">
          ${renderStatBadge('命中', unit.stats.hit, mods.hit, eff.hit, 'text-slate-100', hideStats)}
          ${renderStatBadge('迴避', unit.stats.evasion, mods.evasion, eff.evasion, 'text-slate-100', hideStats)}
          ${renderStatBadge('防護', unit.stats.armor, mods.armor, eff.armor, 'text-slate-100', hideStats)}
          ${renderStatBadge('魔力', unit.stats.magic, mods.magic, eff.magic, 'text-slate-100', hideStats)}
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 text-xs pt-1 border-t border-slate-800">
          <label class="flex items-center gap-1 cursor-pointer select-none">
            <input type="checkbox" ${mainActionState} ${actionDisabled} onchange="toggleAction('${unit.id}', 'main')" class="rounded border-slate-700 bg-slate-950 text-amber-500">
            <span class="${unit.actions.main ? 'line-through text-slate-500' : 'text-slate-300'}">主動作</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer select-none">
            <input type="checkbox" ${subActionState} ${actionDisabled} onchange="toggleAction('${unit.id}', 'sub')" class="rounded border-slate-700 bg-slate-950 text-amber-500">
            <span class="${unit.actions.sub ? 'line-through text-slate-500' : 'text-slate-300'}">補助動作</span>

          <label class="flex items-center gap-1 cursor-pointer select-none">
            <input type="checkbox" ${skillDeclaredState} ${actionDisabled} onchange="toggleAction('${unit.id}', 'skillDeclared')" class="rounded border-slate-700 bg-slate-950 text-amber-500">
            <span class="${unit.actions.skillDeclared ? 'text-amber-400 font-bold' : 'text-slate-400'}">宣告特技</span>
          </label>
        </div>

        ${canEdit ? `
          <div class="flex items-center gap-1 text-[11px] bg-slate-950 p-1 rounded-lg border border-slate-800">
            <span class="text-slate-400 pl-1">移動:</span>
            <select onchange="setEntityMoveType('${unit.id}', this.value)" class="flex-1 bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-slate-200">
              <option value="none" ${unit.moveType === 'none' ? 'selected' : ''}>未移動</option>
              <option value="restricted" ${unit.moveType === 'restricted' ? 'selected' : ''}>制限移動 (3m)</option>
              <option value="normal" ${unit.moveType === 'normal' ? 'selected' : ''}>通常移動 (${unit.moveSpeed || 12}m)</option>
              <option value="full" ${unit.moveType === 'full' ? 'selected' : ''}>全力移動 (${(unit.moveSpeed || 12)*3}m)</option>
            </select>
          </div>
        ` : ''}

        <div class="flex flex-wrap gap-1 pt-1">
          ${renderStatusBadges(unit)}
        </div>

        <div class="space-y-1.5 pt-2 border-t border-slate-800">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
              <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i> 持續效果 / Buff
            </span>
            ${canEdit ? `
              <button onclick="openEffectModal('${unit.id}')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-800/60 px-1.5 py-0.5 rounded transition flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> 新增 Buff
              </button>
            ` : ''}
          </div>
          <div class="space-y-1">
            ${renderEffectsList(unit)}
          </div>
        </div>
      `;

      return card;
    }

    // --- UNIT FORM & MODAL HANDLERS ---
    function openUnitModal(unitId) {
      const modal = document.getElementById('unit-modal');
      const title = document.getElementById('modal-title');
      const zoneSelect = document.getElementById('unit-zone');

      zoneSelect.innerHTML = state.zones.map(z => `<option value="${z.id}">${escapeHtml(z.name)}</option>`).join('');

      if (unitId) {
        const unit = state.entities.find(e => e.id === unitId);
        if (!unit) return;

        title.innerText = '編輯單位數據';
        document.getElementById('unit-id').value = unit.id;
        document.getElementById('unit-name').value = unit.name;
        document.getElementById('unit-faction').value = unit.faction;
        document.getElementById('unit-zone').value = unit.zoneId || state.zones[0].id;
        document.getElementById('unit-hit').value = unit.stats.hit;
        document.getElementById('unit-evasion').value = unit.stats.evasion;
        document.getElementById('unit-armor').value = unit.stats.armor;
        document.getElementById('unit-magic').value = unit.stats.magic;
        document.getElementById('unit-move-speed').value = unit.moveSpeed || 12;
      } else {
        title.innerText = '新增單位 / 魔物';
        document.getElementById('unit-id').value = '';
        document.getElementById('unit-name').value = '';
        document.getElementById('unit-faction').value = 'enemy';
        document.getElementById('unit-zone').value = state.zones[0].id;
        document.getElementById('unit-hit').value = 12;
        document.getElementById('unit-evasion').value = 11;
        document.getElementById('unit-armor').value = 4;
        document.getElementById('unit-magic').value = 0;
        document.getElementById('unit-move-speed').value = 12;
      }

      modal.classList.remove('hidden');
    }

    function handleUnitFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('unit-id').value;
      const name = document.getElementById('unit-name').value.trim();
      const faction = document.getElementById('unit-faction').value;
      const zoneId = document.getElementById('unit-zone').value;
      const hit = parseInt(document.getElementById('unit-hit').value, 10) || 0;
      const evasion = parseInt(document.getElementById('unit-evasion').value, 10) || 0;
      const armor = parseInt(document.getElementById('unit-armor').value, 10) || 0;
      const magic = parseInt(document.getElementById('unit-magic').value, 10) || 0;
      const moveSpeed = parseInt(document.getElementById('unit-move-speed').value, 10) || 12;

      if (!name) return;

      if (id) {
        const unit = state.entities.find(e => e.id === id);
        if (unit) {
          unit.name = name;
          unit.faction = faction;
          unit.zoneId = zoneId;
          unit.moveSpeed = moveSpeed;
          unit.stats = { hit, evasion, armor, magic };
          showToast(`已儲存單位：${name}`);
        }
      } else {
        const defaultHp = faction === 'enemy' ? 30 : 25;
        const defaultMp = 15;

        const newUnit = {
          id: `unit-${Date.now()}`,
          name,
          faction,
          zoneId,
          gridX: Math.floor(Math.random() * 8) + 1,
          gridY: Math.floor(Math.random() * 8) + 1,
          moveSpeed,
          moveType: 'none',
          hp: defaultHp,
          maxHp: defaultHp,
          mp: defaultMp,
          maxMp: defaultMp,
          stats: { hit, evasion, armor, magic },
          actions: { main: false, sub: false, skillDeclared: false },
          statuses: [],
          effects: []
        };
        state.entities.push(newUnit);
        showToast(`已新增單位：${name}`);
      }

      saveState();
      renderApp();
      closeUnitModal();
    }

    function deleteEntity(unitId) {
      const unit = state.entities.find(e => e.id === unitId);
      if (!unit) return;

      if (confirm(`確定要刪除「${unit.name}」嗎？`)) {
        state.entities = state.entities.filter(e => e.id !== unitId);
        saveState();
        renderApp();
        showToast(`已刪除單位`);
      }
    }

    function setEntityMoveType(unitId, moveType) {
      const unit = state.entities.find(e => e.id === unitId);
      if (!unit) return;
      unit.moveType = moveType;
      saveState();
      renderApp();
    }

    // --- MAIN RENDERER ENGINE ---
    function renderApp() {
      const roundDisp = document.getElementById('round-display');
      if (roundDisp) roundDisp.innerText = state.round;

      updateFogOfWarButtonsUI();

      if (state.combatMode === 'grid') {
        renderGridBoard();
      } else {
        renderBattlefield();
      }
    }

    // --- ON LOAD INITIALIZATION ---
    window.onload = function() {
      loadSavedState();
      renderApp();
    };
  </script>
</body>
</html>
