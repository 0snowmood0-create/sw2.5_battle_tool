<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sword World 2.5 戰鬥紀錄器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            swDark: '#0f172a',
            swCard: '#1e293b',
            swHover: '#334155',
            swAccent: '#3b82f6',
            swEnemy: '#ef4444',
            swPlayer: '#10b981',
            swAlly: '#8b5cf6',
          }
        }
      }
    }
  </script>
  <style>
    /* Global scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    
    .zone-drop-active {
      border-color: #60a5fa !important;
      background-color: rgba(30, 58, 138, 0.2) !important;
    }

    .card-dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- ==================== TOP HEADER BAR ==================== -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide text-slate-100 flex items-center gap-2">
            Sword World 2.5
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800">戰鬥紀錄器</span>
          </h1>
          <p class="text-xs text-slate-400">TRPG Combat Tracker & Zone Manager</p>
        </div>
      </div>

      <!-- Round Control Center -->
      <div class="flex items-center gap-3 bg-slate-950 px-4 py-1.5 rounded-xl border border-slate-800 shadow-inner">
        <div class="text-center pr-3 border-r border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-400 block tracking-wider">Round</span>
          <span id="round-display" class="text-2xl font-black text-amber-400 leading-none">1</span>
        </div>
        <button id="btn-next-round" onclick="nextRound()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg shadow-md hover:shadow-amber-500/20 active:scale-95 transition flex items-center gap-2">
          <i class="fa-solid fa-forward-step"></i> 下一輪 (Next Round)
        </button>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Role Switcher (主/客 權限切換) -->
        <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="role-btn-gm" onclick="setRole('gm')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-amber-500 text-slate-950 shadow">
            <i class="fa-solid fa-crown text-[10px]"></i> 👑 GM (主)
          </button>
          <button id="role-btn-player" onclick="setRole('player')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-eye text-[10px]"></i> 👁️ 玩家 (客)
          </button>
        </div>

        <!-- Combat Mode Switcher -->
        <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="mode-btn-standard" onclick="setCombatMode('standard')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-blue-600 text-white shadow">
            <i class="fa-solid fa-layer-group text-[10px]"></i> 區域模式
          </button>
          <button id="mode-btn-grid" onclick="setCombatMode('grid')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
            <i class="fa-solid fa-chess-board text-[10px]"></i> 2D 棋盤
          </button>
        </div>

        <!-- Fog of War GM Controls -->
        <div id="gm-visibility-controls" class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button id="btn-toggle-stats" onclick="toggleMonsterStatsVisibility()" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-emerald-950/80 text-emerald-300 border border-emerald-700 hover:bg-emerald-900/80 shadow-sm">
            <i class="fa-solid fa-eye text-emerald-400"></i> <span>數值：顯示中</span>
          </button>
          <button id="btn-toggle-names" onclick="toggleMonsterNamesVisibility()" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-indigo-950/80 text-indigo-300 border border-indigo-700 hover:bg-indigo-900/80 shadow-sm">
            <i class="fa-solid fa-eye text-indigo-400"></i> <span>名稱：顯示中</span>
          </button>
        </div>

        <button id="btn-add-unit" onclick="openUnitModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3.5 py-2 rounded-lg text-sm shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-plus text-xs"></i> 新增單位
        </button>

        <button id="btn-share-room" onclick="openRoomModal()" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-900/60 font-medium px-3.5 py-2 rounded-lg text-sm shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-wifi text-xs"></i> <span id="share-btn-label">畫面/房間分享</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== MAIN BATTLEFIELD BOARD ==================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">

    <!-- 2D Tactical Grid Board Bar & Canvas (Shown only in Grid Mode) -->
    <div id="grid-mode-container" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
        <div class="flex items-center gap-3 text-xs font-bold text-slate-200 flex-wrap">
          <span class="flex items-center gap-1.5 text-indigo-400">
            <i class="fa-solid fa-chess-board text-sm"></i> 2D 戰術地圖棋盤
          </span>
          <span class="text-slate-500">|</span>
          
          <!-- Mode Tools: Select/Move Token vs Paint Melee Zone -->
          <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
            <button id="grid-tool-select" onclick="setGridTool('select')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-indigo-600 text-white shadow">
              <i class="fa-solid fa-hand-pointer text-[10px]"></i> 🎯 Token 移動/檢視
            </button>
            <button id="grid-tool-paint" onclick="setGridTool('paint')" class="px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
              <i class="fa-solid fa-paintbrush text-[10px]"></i> 🖌️ 設定/繪製亂戰區
            </button>
          </div>

          <!-- Melee Zone Selector (shown when painting) -->
          <div id="paint-zone-selector-box" class="hidden flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">
            <span class="text-slate-400 text-[11px]">劃設區域:</span>
            <select id="grid-paint-zone-select" onchange="setPaintZone(this.value)" class="bg-slate-900 border border-slate-700 rounded px-2 py-0.5 text-slate-200 text-xs font-semibold focus:outline-none">
              <!-- Populated via JS -->
            </select>
          </div>

          <label class="flex items-center gap-1 text-slate-400">
            比例: 
            <select id="grid-scale-select" onchange="updateGridScale(this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-slate-200 text-xs">
              <option value="3" selected>1 格 = 3 米 (SW2.5 亂戰半徑)</option>
              <option value="1">1 格 = 1 米</option>
              <option value="5">1 格 = 5 米</option>
            </select>
          </label>
        </div>

        <div class="flex items-center gap-2 text-xs flex-wrap">
          <button onclick="autoDetectGridMeleeZones()" class="bg-amber-950 hover:bg-amber-900 text-amber-300 px-2.5 py-1.5 rounded-lg border border-amber-800/80 transition flex items-center gap-1 font-bold">
            <i class="fa-solid fa-bolt text-xs"></i> ⚡ 自動偵測亂戰
          </button>
          <button onclick="clearGridMeleeZones()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1">
            <i class="fa-solid fa-eraser text-xs"></i> 清空棋盤亂戰區
          </button>
          <button onclick="clearGridSelection()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
            <i class="fa-solid fa-xmark"></i> 取消選取
          </button>
          <div id="grid-selection-info" class="px-3 py-1.5 rounded-lg bg-indigo-950 text-indigo-300 border border-indigo-800/60 font-mono text-xs font-bold">
            點擊棋子檢視移動射程與詳細數據
          </div>
        </div>
      </div>

      <!-- Grid Board View Interactive Container & Selected Unit Panel -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
        <div class="lg:col-span-2 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-2xl overflow-x-auto flex justify-center">
          <div id="tactical-board" class="grid grid-cols-12 gap-1 bg-slate-950 p-3 rounded-xl border border-slate-800/80 shadow-inner min-w-[640px] select-none">
            <!-- Dynamically generated 12x12 Grid Cells & Tokens -->
          </div>
        </div>

        <!-- Selected Unit Detail Card in Grid Mode -->
        <div class="space-y-2">
          <h4 class="text-xs font-bold text-slate-400 flex items-center justify-between px-1">
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-id-card text-indigo-400"></i> 選取單位詳細資訊</span>
            <span class="text-[10px] text-slate-500 font-normal">點擊盤上棋子切換檢視</span>
          </h4>
          <div id="grid-selected-unit-panel" class="min-h-[380px]">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- Zone Container Grid (Shown in Standard Mode) -->
    <div id="battlefield-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 items-start">
      <!-- Dynamic Zones Rendered Here -->
    </div>
  </main>

  <!-- ==================== MODAL: ADD / EDIT UNIT ==================== -->
  <div id="unit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden">
      
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <h3 id="modal-title" class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-blue-400"></i> 新增單位 / 魔物
        </h3>
        <button onclick="closeUnitModal()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="unit-form" onsubmit="handleUnitFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="unit-id">

        <!-- Name & Faction -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2 space-y-1">
            <label class="text-xs font-semibold text-slate-400">名稱</label>
            <input type="text" id="unit-name" required placeholder="如：艾爾琳、蠻族戰士 A" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-400">陣營/類型</label>
            <select id="unit-faction" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
              <option value="player">己方 (PC)</option>
              <option value="ally">眷族/盟友</option>
              <option value="enemy" selected>敵方 (魔物)</option>
            </select>
          </div>
        </div>

        <!-- Initial Zone Position -->
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400">初始位置區 (區域模式)</label>
          <select id="unit-zone" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            <!-- Populated via JS -->
          </select>
        </div>

        <!-- Combat Stats & Movement (SW2.5 Core) -->
        <div class="border-t border-slate-800 pt-3 space-y-2">
          <span class="text-xs font-bold text-slate-300 block">SW 2.5 基礎數值 & 移動力</span>
          <div class="grid grid-cols-5 gap-2.5">
            <div>
              <label class="text-xs text-slate-400 block mb-1 text-center font-medium">命中</label>
              <input type="number" id="unit-hit" value="12" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-sm text-center text-slate-100 font-bold focus:border-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1 text-center font-medium">迴避</label>
              <input type="number" id="unit-evasion" value="11" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-sm text-center text-slate-100 font-bold focus:border-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1 text-center font-medium">防護點</label>
              <input type="number" id="unit-armor" value="4" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-sm text-center text-slate-100 font-bold focus:border-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1 text-center font-medium whitespace-nowrap">魔力/魔攻</label>
              <input type="number" id="unit-magic" value="0" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-sm text-center text-slate-100 font-bold focus:border-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="text-xs text-indigo-400 block mb-1 text-center font-medium whitespace-nowrap">移動 (m)</label>
              <input type="number" id="unit-move-speed" value="12" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-sm text-center text-slate-100 font-bold focus:border-blue-500 focus:outline-none" title="通常移動距離 (m)">
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="pt-4 flex justify-end gap-2 border-t border-slate-800">
          <button type="button" onclick="closeUnitModal()" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-slate-200 transition">
            取消
          </button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2 rounded-lg text-sm shadow-md transition flex items-center gap-2">
            <i class="fa-solid fa-floppy-disk text-xs"></i> 儲存單位
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== MODAL: ADD / EDIT EFFECT (BUFF/DEBUFF) ==================== -->
  <div id="effect-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> 新增持續效果 / Buff
        </h3>
        <button onclick="closeEffectModal()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="effect-form" onsubmit="saveEffect(event)" class="p-6 space-y-4">
        <input type="hidden" id="effect-target-id">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400">SW 2.5 常用預設效果</label>
          <select id="effect-preset" onchange="applyEffectPreset(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none">
            <option value="">-- 自訂效果 / 特技 --</option>
            <option value="DEFENSE">《防禦術》 (防護+1, 3R)</option>
            <option value="CATS_EYE">《貓之眼》 (命中+1, 3R)</option>
            <option value="RABBIT_FOOT">《兔之足》 (迴避+1, 3R)</option>
            <option value="HOLY_ARMOR">《神聖護甲》 (防護+2, 3R)</option>
            <option value="ARMOR_BREAK">《破甲》 (防護-2, 3R)</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold text-slate-400">效果名稱</label>
          <input type="text" id="effect-name" required placeholder="如：《防禦術》" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-400">持續輪數 (Round)</label>
            <input type="number" id="effect-rounds" value="3" min="1" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none">
          </div>
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-400">修正目標與數值</label>
            <div class="flex gap-1">
              <select id="effect-stat" class="w-1/2 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-100 focus:outline-none">
                <option value="none">無數值修正</option>
                <option value="hit">命中</option>
                <option value="evasion">迴避</option>
                <option value="armor">防護點</option>
                <option value="magic">魔力</option>
              </select>
              <input type="number" id="effect-val" value="1" class="w-1/2 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2 text-xs text-center text-slate-100 font-bold focus:outline-none">
            </div>
          </div>
        </div>
        <div class="pt-3 flex justify-end gap-2 border-t border-slate-800">
          <button type="button" onclick="closeEffectModal()" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-slate-200">取消</button>
          <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-2 rounded-lg text-sm shadow">新增效果</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== MODAL: LIVE ROOM SHARE ==================== -->
  <div id="room-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-wifi text-indigo-400"></i> 即時連線房間設定
        </h3>
        <button onclick="closeRoomModal()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
          <span class="text-xs font-bold text-slate-400 block">建立全新房間 (GM 主端)</span>
          <button onclick="createShareRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg text-sm shadow transition">
            <i class="fa-solid fa-plus-circle"></i> 建立線上戰鬥房間
          </button>
        </div>
        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="flex-shrink mx-4 text-xs font-bold text-slate-500">或輸入代碼加入</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>
        <div class="space-y-2">
          <input type="text" id="join-room-code" placeholder="輸入 6 位數房間代碼 (如 SW-8942)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-center font-mono text-slate-100 focus:outline-none">
          <button onclick="joinShareRoom()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold py-2.5 rounded-lg text-sm transition">
            加入戰鬥房間 (客端)
          </button>
        </div>
        <div id="active-room-info" class="hidden bg-indigo-950/60 border border-indigo-800 p-3 rounded-xl text-center space-y-2">
          <span class="text-xs text-indigo-300 block">目前房間代碼</span>
          <span id="active-room-code-display" class="text-2xl font-black font-mono text-indigo-200 block">SW-0000</span>
          <div class="flex gap-2">
            <button onclick="copyRoomCode()" class="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white text-xs font-bold py-1.5 rounded shadow">複製代碼</button>
            <button onclick="leaveRoom()" class="flex-1 bg-rose-900 hover:bg-rose-800 text-rose-200 text-xs font-bold py-1.5 rounded border border-rose-700">離開房間</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    // System State
    let state = {
      role: 'gm', // 'gm' or 'player'
      combatMode: 'standard', // 'standard' or 'grid'
      showMonsterStats: true,
      showMonsterNames: true,
      round: 1,
      gridScale: 3,
      gridTool: 'select', // 'select' or 'paint'
      paintZoneId: 'melee-1',
      selectedUnitId: null,
      zones: [
        { id: 'player-rear', name: '己方後衛 (Player Rear)', isMelee: false, gridCells: [] },
        { id: 'melee-1', name: '亂戰區域 #1', isMelee: true, gridCells: ['4,4', '4,5', '5,4', '5,5'] },
        { id: 'enemy-rear', name: '敵方後衛 (Enemy Rear)', isMelee: false, gridCells: [] }
      ],
      units: [
        {
          id: 'u-1',
          name: '艾爾琳',
          faction: 'player',
          zoneId: 'melee-1',
          gridPos: { x: 4, y: 4 },
          hp: { current: 28, max: 28 },
          mp: { current: 18, max: 20 },
          baseHit: 13,
          baseEvasion: 12,
          baseArmor: 5,
          baseMagic: 8,
          moveSpeed: 12,
          actions: { main: false, sub: false },
          effects: [{ id: 'e-1', name: '《防禦術》', rounds: 3, stat: 'armor', val: 1 }]
        },
        {
          id: 'u-2',
          name: '蠻族戰士 A',
          faction: 'enemy',
          zoneId: 'melee-1',
          gridPos: { x: 5, y: 5 },
          hp: { current: 32, max: 35 },
          mp: { current: 10, max: 10 },
          baseHit: 12,
          baseEvasion: 11,
          baseArmor: 4,
          baseMagic: 0,
          moveSpeed: 10,
          actions: { main: false, sub: false },
          effects: []
        }
      ]
    };

    // Helper: Toast notification
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-lg shadow-xl text-xs font-bold text-white transition-all transform duration-300 translate-y-2 border ${
        type === 'error' ? 'bg-rose-600 border-rose-500' : type === 'success' ? 'bg-emerald-600 border-emerald-500' : 'bg-slate-800 border-slate-700'
      }`;
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Modal Control Functions
    function openUnitModal(unitId = null) {
      const modal = document.getElementById('unit-modal');
      const form = document.getElementById('unit-form');
      const title = document.getElementById('modal-title');
      const zoneSelect = document.getElementById('unit-zone');

      // Populate zone select
      zoneSelect.innerHTML = state.zones.map(z => `<option value="${z.id}">${z.name}</option>`).join('');

      if (unitId) {
        const unit = state.units.find(u => u.id === unitId);
        if (!unit) return;
        title.innerHTML = `<i class="fa-solid fa-user-pen text-blue-400"></i> 編輯單位`;
        document.getElementById('unit-id').value = unit.id;
        document.getElementById('unit-name').value = unit.name;
        document.getElementById('unit-faction').value = unit.faction;
        document.getElementById('unit-zone').value = unit.zoneId;
        document.getElementById('unit-hit').value = unit.baseHit;
        document.getElementById('unit-evasion').value = unit.baseEvasion;
        document.getElementById('unit-armor').value = unit.baseArmor;
        document.getElementById('unit-magic').value = unit.baseMagic;
        document.getElementById('unit-move-speed').value = unit.moveSpeed;
      } else {
        title.innerHTML = `<i class="fa-solid fa-user-plus text-blue-400"></i> 新增單位 / 魔物`;
        form.reset();
        document.getElementById('unit-id').value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeUnitModal() {
      document.getElementById('unit-modal').classList.add('hidden');
    }

    function handleUnitFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('unit-id').value;
      const name = document.getElementById('unit-name').value.trim();
      const faction = document.getElementById('unit-faction').value;
      const zoneId = document.getElementById('unit-zone').value;
      const hit = parseInt(document.getElementById('unit-hit').value) || 0;
      const evasion = parseInt(document.getElementById('unit-evasion').value) || 0;
      const armor = parseInt(document.getElementById('unit-armor').value) || 0;
      const magic = parseInt(document.getElementById('unit-magic').value) || 0;
      const moveSpeed = parseInt(document.getElementById('unit-move-speed').value) || 10;

      if (id) {
        const unit = state.units.find(u => u.id === id);
        if (unit) {
          unit.name = name;
          unit.faction = faction;
          unit.zoneId = zoneId;
          unit.baseHit = hit;
          unit.baseEvasion = evasion;
          unit.baseArmor = armor;
          unit.baseMagic = magic;
          unit.moveSpeed = moveSpeed;
        }
      } else {
        const newUnit = {
          id: 'u-' + Date.now(),
          name,
          faction,
          zoneId,
          gridPos: { x: Math.floor(Math.random() * 8) + 2, y: Math.floor(Math.random() * 8) + 2 },
          hp: { current: 30, max: 30 },
          mp: { current: 15, max: 15 },
          baseHit: hit,
          baseEvasion: evasion,
          baseArmor: armor,
          baseMagic: magic,
          moveSpeed: moveSpeed,
          actions: { main: false, sub: false },
          effects: []
        };
        state.units.push(newUnit);
      }
      closeUnitModal();
      renderApp();
      showToast('單位資料已成功儲存', 'success');
    }

    // Role & Fog of War Management
    function setRole(role) {
      state.role = role;
      document.getElementById('role-btn-gm').className = role === 'gm' ? 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-amber-500 text-slate-950 shadow' : 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
      document.getElementById('role-btn-player').className = role === 'player' ? 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-emerald-500 text-slate-950 shadow' : 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
      renderApp();
    }

    function setCombatMode(mode) {
      state.combatMode = mode;
      document.getElementById('mode-btn-standard').className = mode === 'standard' ? 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-blue-600 text-white shadow' : 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
      document.getElementById('mode-btn-grid').className = mode === 'grid' ? 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-blue-600 text-white shadow' : 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
      
      const gridContainer = document.getElementById('grid-mode-container');
      const standardContainer = document.getElementById('battlefield-grid');
      if (mode === 'grid') {
        gridContainer.classList.remove('hidden');
        standardContainer.classList.add('hidden');
      } else {
        gridContainer.classList.add('hidden');
        standardContainer.classList.remove('hidden');
      }
      renderApp();
    }

    function toggleMonsterStatsVisibility() {
      state.showMonsterStats = !state.showMonsterStats;
      updateFogOfWarButtonsUI();
      renderApp();
    }

    function toggleMonsterNamesVisibility() {
      state.showMonsterNames = !state.showMonsterNames;
      updateFogOfWarButtonsUI();
      renderApp();
    }

    function updateFogOfWarButtonsUI() {
      const statsBtn = document.getElementById('btn-toggle-stats');
      const namesBtn = document.getElementById('btn-toggle-names');

      if (state.showMonsterStats) {
        statsBtn.className = 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-emerald-950/80 text-emerald-300 border border-emerald-700 hover:bg-emerald-900/80 shadow-sm';
        statsBtn.innerHTML = `<i class="fa-solid fa-eye text-emerald-400"></i> <span>數值：顯示中</span>`;
      } else {
        statsBtn.className = 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-rose-950/80 text-rose-300 border border-rose-700 hover:bg-rose-900/80 shadow-sm';
        statsBtn.innerHTML = `<i class="fa-solid fa-eye-slash text-rose-400"></i> <span>數值：隱藏中</span>`;
      }

      if (state.showMonsterNames) {
        namesBtn.className = 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-indigo-950/80 text-indigo-300 border border-indigo-700 hover:bg-indigo-900/80 shadow-sm';
        namesBtn.innerHTML = `<i class="fa-solid fa-eye text-indigo-400"></i> <span>名稱：顯示中</span>`;
      } else {
        namesBtn.className = 'px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 bg-rose-950/80 text-rose-300 border border-rose-700 hover:bg-rose-900/80 shadow-sm';
        namesBtn.innerHTML = `<i class="fa-solid fa-eye-slash text-rose-400"></i> <span>名稱：隱藏中</span>`;
      }
    }

    function nextRound() {
      state.round += 1;
      document.getElementById('round-display').innerText = state.round;
      state.units.forEach(u => {
        u.actions.main = false;
        u.actions.sub = false;
        u.effects.forEach(e => e.rounds -= 1);
        u.effects = u.effects.filter(e => e.rounds > 0);
      });
      renderApp();
      showToast(`進入第 ${state.round} 輪`, 'info');
    }

    // Effect Modals
    function openEffectModal(unitId) {
      document.getElementById('effect-target-id').value = unitId;
      document.getElementById('effect-modal').classList.remove('hidden');
    }
    function closeEffectModal() {
      document.getElementById('effect-modal').classList.add('hidden');
    }
    function applyEffectPreset(val) {
      if (!val) return;
      const presets = {
        DEFENSE: { name: '《防禦術》', rounds: 3, stat: 'armor', val: 1 },
        CATS_EYE: { name: '《貓之眼》', rounds: 3, stat: 'hit', val: 1 },
        RABBIT_FOOT: { name: '《兔之足》', rounds: 3, stat: 'evasion', val: 1 },
        HOLY_ARMOR: { name: '《神聖護甲》', rounds: 3, stat: 'armor', val: 2 },
        ARMOR_BREAK: { name: '《破甲》', rounds: 3, stat: 'armor', val: -2 }
      };
      const p = presets[val];
      if (p) {
        document.getElementById('effect-name').value = p.name;
        document.getElementById('effect-rounds').value = p.rounds;
        document.getElementById('effect-stat').value = p.stat;
        document.getElementById('effect-val').value = p.val;
      }
    }
    function saveEffect(e) {
      e.preventDefault();
      const targetId = document.getElementById('effect-target-id').value;
      const unit = state.units.find(u => u.id === targetId);
      if (unit) {
        unit.effects.push({
          id: 'e-' + Date.now(),
          name: document.getElementById('effect-name').value.trim(),
          rounds: parseInt(document.getElementById('effect-rounds').value) || 1,
          stat: document.getElementById('effect-stat').value,
          val: parseInt(document.getElementById('effect-val').value) || 0
        });
      }
      closeEffectModal();
      renderApp();
    }

    // Room Modals
    function openRoomModal() { document.getElementById('room-modal').classList.remove('hidden'); }
    function closeRoomModal() { document.getElementById('room-modal').classList.add('hidden'); }
    function createShareRoom() {
      const code = 'SW-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('active-room-code-display').innerText = code;
      document.getElementById('active-room-info').classList.remove('hidden');
      document.getElementById('share-btn-label').innerText = code;
      setRole('gm');
      showToast(`戰鬥房間 ${code} 建立成功`, 'success');
    }
    function joinShareRoom() {
      const code = document.getElementById('join-room-code').value.trim().toUpperCase();
      if (!code) return;
      document.getElementById('active-room-code-display').innerText = code;
      document.getElementById('active-room-info').classList.remove('hidden');
      document.getElementById('share-btn-label').innerText = code;
      setRole('player');
      showToast(`已加入房間 ${code}`, 'success');
    }
    function leaveRoom() {
      document.getElementById('active-room-info').classList.add('hidden');
      document.getElementById('share-btn-label').innerText = '畫面/房間分享';
      showToast('已離開連線房間', 'info');
    }
    function copyRoomCode() {
      const code = document.getElementById('active-room-code-display').innerText;
      navigator.clipboard ? navigator.clipboard.writeText(code) : null;
      showToast('已複製房間代碼', 'info');
    }

    // Grid Tool Actions
    function setGridTool(tool) {
      state.gridTool = tool;
      document.getElementById('grid-tool-select').className = tool === 'select' ? 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-indigo-600 text-white shadow' : 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
      document.getElementById('grid-tool-paint').className = tool === 'paint' ? 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 bg-amber-600 text-white shadow' : 'px-2.5 py-1 rounded-md font-bold transition flex items-center gap-1 text-slate-400 hover:text-slate-200';
      
      const paintBox = document.getElementById('paint-zone-selector-box');
      if (tool === 'paint') paintBox.classList.remove('hidden');
      else paintBox.classList.add('hidden');
    }
    function updateGridScale(val) {
      state.gridScale = parseInt(val) || 3;
      renderApp();
    }

    // SW 2.5 亂戰區域動態運算與自動消解 Engine
    function recalculateMeleeZones() {
      const players = state.units.filter(u => (u.faction === 'player' || u.faction === 'ally') && u.gridPos);
      const enemies = state.units.filter(u => u.faction === 'enemy' && u.gridPos);

      const activeMeleeCells = new Set();
      const engagedUnits = new Set();

      // 檢查所有敵我配對是否相鄰 (Chebyshev 距離 <= 1 格，即 3 米接觸半徑)
      players.forEach(p => {
        enemies.forEach(e => {
          const dx = Math.abs(p.gridPos.x - e.gridPos.x);
          const dy = Math.abs(p.gridPos.y - e.gridPos.y);
          if (dx <= 1 && dy <= 1) {
            // 標記兩單位所在的格點
            activeMeleeCells.add(`${p.gridPos.x},${p.gridPos.y}`);
            activeMeleeCells.add(`${e.gridPos.x},${e.gridPos.y}`);
            engagedUnits.add(p);
            engagedUnits.add(e);
          }
        });
      });

      // 取得或建立亂戰區物件
      let meleeZone = state.zones.find(z => z.isMelee);
      if (!meleeZone) {
        meleeZone = { id: 'melee-1', name: '亂戰區域 #1', isMelee: true, gridCells: [] };
        state.zones.push(meleeZone);
      }

      // 重設格點清單：僅保留目前確實有敵我接觸的格點（單位移走後自動消解舊亂戰格）
      meleeZone.gridCells = Array.from(activeMeleeCells);

      // 同步更新所有單位的 zoneId 狀態
      state.units.forEach(u => {
        if (engagedUnits.has(u)) {
          u.zoneId = meleeZone.id;
        } else if (u.zoneId === meleeZone.id) {
          // 若不在亂戰中，自動恢復為後衛區
          u.zoneId = u.faction === 'enemy' ? 'enemy-rear' : 'player-rear';
        }
      });
    }

    function autoDetectGridMeleeZones() {
      recalculateMeleeZones();
      const meleeZone = state.zones.find(z => z.isMelee);
      const count = meleeZone ? meleeZone.gridCells.length : 0;
      renderApp();
      if (count > 0) {
        showToast(`已成功自動偵測並劃定亂戰區（包含 ${count} 個接觸格點）`, 'success');
      } else {
        showToast('目前沒有敵我接觸 (1格/3m內)，所有亂戰區已消解', 'info');
      }
    }

    function clearGridMeleeZones() {
      state.zones.forEach(z => z.gridCells = []);
      renderApp();
      showToast('已清空棋盤亂戰區域', 'info');
    }

    function clearGridSelection() {
      state.selectedUnitId = null;
      renderApp();
    }

    // Dynamic Effective Stats Helper
    function getEffectiveStats(unit) {
      let stats = { hit: unit.baseHit, evasion: unit.baseEvasion, armor: unit.baseArmor, magic: unit.baseMagic };
      unit.effects.forEach(e => {
        if (e.stat && stats.hasOwnProperty(e.stat)) {
          stats[e.stat] += e.val;
        }
      });
      return stats;
    }

    // Main App Renderer
    function renderApp() {
      document.getElementById('round-display').innerText = state.round;
      
      // Update zone paint select options
      const paintSelect = document.getElementById('grid-paint-zone-select');
      if (paintSelect) {
        paintSelect.innerHTML = state.zones.filter(z => z.isMelee).map(z => `<option value="${z.id}">${z.name}</option>`).join('');
      }

      renderStandardZones();
      renderGridBoard();
    }

    function renderStandardZones() {
      const container = document.getElementById('battlefield-grid');
      if (!container) return;
      container.innerHTML = state.zones.map(zone => {
        const zoneUnits = state.units.filter(u => u.zoneId === zone.id);
        return `
          <div class="bg-slate-900 border ${zone.isMelee ? 'border-amber-500/50 bg-amber-950/10' : 'border-slate-800'} rounded-2xl p-4 min-h-[300px] flex flex-col gap-3 shadow-lg">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800">
              <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                <i class="${zone.isMelee ? 'fa-solid fa-swords text-amber-400' : 'fa-solid fa-shield text-slate-400'}"></i>
                ${zone.name}
              </h3>
              <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-950 text-slate-400">${zoneUnits.length} 單位</span>
            </div>
            <div class="flex-1 space-y-3">
              ${zoneUnits.map(u => renderUnitCardHTML(u)).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderUnitCardHTML(unit) {
      const isEnemy = unit.faction === 'enemy';
      const stats = getEffectiveStats(unit);
      const isGM = state.role === 'gm';
      const hideStats = isEnemy && !state.showMonsterStats && !isGM;
      const hideName = isEnemy && !state.showMonsterNames && !isGM;

      const displayName = hideName ? `未知魔物 #${unit.id.slice(-2)}` : unit.name;

      return `
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2 shadow">
          <div class="flex items-center justify-between">
            <span class="font-bold text-sm ${isEnemy ? 'text-rose-400' : 'text-emerald-400'} flex items-center gap-1.5">
              ${displayName}
            </span>
            ${isGM ? `
              <button onclick="openUnitModal('${unit.id}')" class="text-xs text-slate-500 hover:text-slate-300">
                <i class="fa-solid fa-pen"></i>
              </button>
            ` : ''}
          </div>
          <div class="text-xs space-y-1">
            <div class="flex justify-between text-slate-400 font-mono">
              <span>HP: ${hideStats ? `?? / ?? (傷害: ${unit.hp.max - unit.hp.current})` : `${unit.hp.current}/${unit.hp.max}`}</span>
              <span>MP: ${hideStats ? `?? / ??` : `${unit.mp.current}/${unit.mp.max}`}</span>
            </div>
            <div class="grid grid-cols-4 gap-1 text-[11px] text-center pt-1 font-mono text-slate-300">
              <span class="bg-slate-900 rounded py-0.5">命中:${hideStats ? '?' : stats.hit}</span>
              <span class="bg-slate-900 rounded py-0.5">迴避:${hideStats ? '?' : stats.evasion}</span>
              <span class="bg-slate-900 rounded py-0.5">防護:${hideStats ? '?' : stats.armor}</span>
              <span class="bg-slate-900 rounded py-0.5">魔力:${hideStats ? '?' : stats.magic}</span>
            </div>
          </div>
          ${(isGM || !isEnemy) ? `
            <div class="pt-2 border-t border-slate-900 flex items-center justify-between gap-1 text-[11px]">
              <button onclick="openEffectModal('${unit.id}')" class="text-amber-400 hover:underline">+ 增添 Buff</button>
              <div class="flex gap-1 text-[10px]">
                ${unit.effects.map(e => `<span class="bg-amber-950 text-amber-300 px-1.5 py-0.5 rounded border border-amber-800">${e.name} (${e.rounds}R)</span>`).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderGridBoard() {
      const board = document.getElementById('tactical-board');
      if (!board) return;
      
      const selectedUnit = state.selectedUnitId ? state.units.find(u => u.id === state.selectedUnitId) : null;
      
      // 計算選取單位的移動步數格數 (以 gridScale 為基準)
      let normMoveGrid = 0;
      if (selectedUnit && selectedUnit.gridPos) {
        const speed = selectedUnit.moveSpeed || 10;
        normMoveGrid = Math.floor(speed / state.gridScale);
      }

      let html = '';
      for (let r = 0; r < 12; r++) {
        for (let c = 0; c < 12; c++) {
          const key = `${c},${r}`;
          const isPainted = state.zones.some(z => z.isMelee && z.gridCells.includes(key));
          const unit = state.units.find(u => u.gridPos && u.gridPos.x === c && u.gridPos.y === r);
          const isSelected = selectedUnit && selectedUnit.gridPos && selectedUnit.gridPos.x === c && selectedUnit.gridPos.y === r;

          // 移動半徑範圍計算 (1格制限, 通常移動, 全力移動)
          let moveRangeClass = '';
          if (selectedUnit && selectedUnit.gridPos && !unit) {
            const dist = Math.max(Math.abs(selectedUnit.gridPos.x - c), Math.abs(selectedUnit.gridPos.y - r));
            if (dist === 1) {
              moveRangeClass = 'ring-1 ring-emerald-500/50 bg-emerald-950/20'; // 制限移動 3m
            } else if (dist <= normMoveGrid) {
              moveRangeClass = 'bg-blue-950/20'; // 通常移動
            }
          }

          html += `
            <div onclick="handleGridCellClick(${c}, ${r})" class="aspect-square bg-slate-900 border border-slate-800/60 rounded flex flex-col items-center justify-center relative cursor-pointer hover:border-indigo-400 transition-all select-none ${moveRangeClass} ${isPainted ? 'bg-amber-950/40 border-amber-400/80 shadow-[inset_0_0_8px_rgba(251,191,36,0.2)]' : ''} ${isSelected ? 'ring-2 ring-indigo-400 ring-offset-2 ring-offset-slate-950 z-10' : ''}">
              
              <!-- 亂戰區標誌背景浮效 -->
              ${isPainted ? `<span class="absolute top-0.5 right-0.5 text-[9px] text-amber-400 font-bold opacity-80"><i class="fa-solid fa-swords"></i></span>` : ''}

              <!-- 單位 Token 繪製 -->
              ${unit ? `
                <div class="w-8 h-8 rounded-full ${unit.faction === 'enemy' ? 'bg-rose-600' : unit.faction === 'ally' ? 'bg-purple-600' : 'bg-emerald-600'} text-white text-[11px] font-black flex items-center justify-center shadow-lg border-2 ${isSelected ? 'border-amber-300 scale-110' : 'border-white/30'} transition-transform">
                  ${unit.name.charAt(0)}
                </div>
                <span class="text-[9px] font-bold text-slate-300 truncate max-w-[90%] mt-0.5">${state.role === 'player' && unit.faction === 'enemy' && !state.showMonsterNames ? `未知` : unit.name}</span>
              ` : ''}
            </div>
          `;
        }
      }
      board.innerHTML = html;

      // Render selected unit detail panel in grid mode
      const panel = document.getElementById('grid-selected-unit-panel');
      const selectionInfo = document.getElementById('grid-selection-info');
      if (panel) {
        if (selectedUnit) {
          panel.innerHTML = renderUnitCardHTML(selectedUnit);
          if (selectionInfo) {
            selectionInfo.innerText = `選取: ${selectedUnit.name} (${selectedUnit.gridPos ? `X:${selectedUnit.gridPos.x}, Y:${selectedUnit.gridPos.y}` : '無座標'})`;
          }
        } else {
          panel.innerHTML = '<div class="text-xs text-slate-500 text-center py-12 border border-dashed border-slate-800 rounded-xl">點擊棋盤上的 Token 查看詳細內容</div>';
          if (selectionInfo) {
            selectionInfo.innerText = '點擊棋子檢視移動射程與詳細數據';
          }
        }
      }
    }

    function handleGridCellClick(x, y) {
      if (state.gridTool === 'paint') {
        const zone = state.zones.find(z => z.id === state.paintZoneId);
        if (zone) {
          const key = `${x},${y}`;
          const idx = zone.gridCells.indexOf(key);
          if (idx >= 0) zone.gridCells.splice(idx, 1);
          else zone.gridCells.push(key);
          renderApp();
        }
      } else {
        const unitOnCell = state.units.find(u => u.gridPos && u.gridPos.x === x && u.gridPos.y === y);
        
        if (unitOnCell) {
          // 點擊已有單位的格點：若為已選取單位則取消選取，否則切換選取該單位
          if (state.selectedUnitId === unitOnCell.id) {
            state.selectedUnitId = null;
          } else {
            state.selectedUnitId = unitOnCell.id;
          }
        } else if (state.selectedUnitId && state.role === 'gm') {
          // GM 點擊空白格點：移動選取中的單位至新座標
          const selUnit = state.units.find(u => u.id === state.selectedUnitId);
          if (selUnit) {
            selUnit.gridPos = { x, y };
            // 移動後自動觸發亂戰區域計算（即時形成新亂戰區 / 消解舊亂戰區）
            recalculateMeleeZones();
            showToast(`${selUnit.name} 移動至 (${x}, ${y})`, 'info');
          }
        } else {
          // 點擊空白區域且非移動操作：取消選取
          state.selectedUnitId = null;
        }
        renderApp();
      }
    }

    // Attach to Global Scope for inline HTML event attributes
    window.openUnitModal = openUnitModal;
    window.closeUnitModal = closeUnitModal;
    window.handleUnitFormSubmit = handleUnitFormSubmit;
    window.setRole = setRole;
    window.setCombatMode = setCombatMode;
    window.toggleMonsterStatsVisibility = toggleMonsterStatsVisibility;
    window.toggleMonsterNamesVisibility = toggleMonsterNamesVisibility;
    window.nextRound = nextRound;
    window.openEffectModal = openEffectModal;
    window.closeEffectModal = closeEffectModal;
    window.applyEffectPreset = applyEffectPreset;
    window.saveEffect = saveEffect;
    window.openRoomModal = openRoomModal;
    window.closeRoomModal = closeRoomModal;
    window.createShareRoom = createShareRoom;
    window.joinShareRoom = joinShareRoom;
    window.leaveRoom = leaveRoom;
    window.copyRoomCode = copyRoomCode;
    window.setGridTool = setGridTool;
    window.updateGridScale = updateGridScale;
    window.autoDetectGridMeleeZones = autoDetectGridMeleeZones;
    window.clearGridMeleeZones = clearGridMeleeZones;
    window.clearGridSelection = clearGridSelection;
    window.handleGridCellClick = handleGridCellClick;

    // Initialization
    window.onload = function() {
      recalculateMeleeZones();
      updateFogOfWarButtonsUI();
      renderApp();
    };
  </script>
</body>
</html>
